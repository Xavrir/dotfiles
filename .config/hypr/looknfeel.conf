general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
    resize_on_border = false
}

decoration {
    rounding = 12

    active_opacity = 0.97
    inactive_opacity = 0.90
    fullscreen_opacity = 1.0

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(00000066)
    }

    blur {
        enabled = true
        size = 3
        passes = 2
        special = true
        brightness = 0.65
        contrast = 0.80
    }
}

dwindle {
    preserve_split = true
    force_split = 0
}
