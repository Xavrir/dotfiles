backend = "glx";
vsync = true;

# Slight rounding and shadows for a soft look.
corner-radius = 8;
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.35;

# Core translucency settings.
inactive-opacity-override = false;
active-opacity = 0.92;
inactive-opacity = 0.85;
frame-opacity = 0.85;

blur = {
  method = "dual_kawase";
  strength = 5;
  background = true;
  background-frame = true;
};

# Per-app overrides (adjust to taste).
opacity-rule = [
  "95:class_g = 'Alacritty'",
  "95:class_g = 'kitty'",
  "100:class_g = 'Firefox'",
  "100:class_g = 'Chromium'",
  "100:class_g = 'Google-chrome'"
];
